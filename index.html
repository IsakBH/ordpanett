<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OPN2</title>
	<link rel="icon" href="assets/ordpanett_logo.png">
	<link rel="stylesheet" href="styles/main.css">
	<link rel="stylesheet" href="styles/editor.css">
	<link rel="stylesheet" href="styles/documentmanager.css">

	<!-- Fonter og ikoner -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    <div id="document-manager-container">
        <h3>Mine dokumenter</h3>
        <button id="document-manager-new-document-button">
            <i class="fa-solid fa-plus"></i>
            Nytt Ord dokument
        </button>
        <div id="document-manager-search-container">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="document-manager-search-button" placeholder="Søk i dokumenter...">
        </div>
        <div id="document-manager-document-list-container">
            <ul id="document-manager-document-list"></ul>
        </div>
    </div>

    <div id="main-editor-container">
        <h1 id="main-editor-heading">Ord På Nett 2</h1>

        <div id="main-editor-toolbar"> <!--  Toolbaren-->

            <!-- undo og redo -->
            <button id="undo-toolbar-button" class="toolbar-button" value="undo" title="Angre (undo)">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="redo-toolbar-button" class="toolbar-button" value="redo" title="Gjør om/angre angringen (redo)">
                <i class="fa-solid fa-rotate-right"></i>
            </button>

            <hr>

            <!-- font knapper -->
            <!--<select id="fontSize" class="adv-toolbar-button"></select>-->

            <!-- tekst  formaterings greier -->
            <button id="bold-toolbar-button" class="toolbar-button" value="bold">
                <i class="fa-solid fa-bold"></i>
            </button>
            <button id="italic-toolbar-button" class="toolbar-button" value="italic">
                <i class="fa-solid fa-italic"></i>
            </button>
            <button id="underline-toolbar-button" class="toolbar-button" value="underline">
                <i class="fa-solid fa-underline"></i>
            </button>
            <button id="strikethrough-toolbar-button" class="toolbar-button" value="strikethrough">
                <i class="fa-solid fa-strikethrough"></i>
            </button>

            <hr>

            <!-- farger -->
            <!--<div class="input-wrapper">
                <input type="color" id="foreColor" class="adv-toolbar-button" />
                <i class="fa-solid fa-palette"></i>
            </div>
            <div class="input-wrapper">
                <input type="color" id="backColor" class="adv-toolbar-button" />
                <i class="fa-solid fa-paint-roller"></i>
            </div>

            <hr>-->

            <!-- hyper link -->
            <button id="link-toolbar-button" class="advanced-toolbar-button"> <!-- Har egen funksjonalitet, bruker ikke execCommand -->
                <i class="fa fa-link"></i>
            </button>
            <button id="unlink-toolbar-button" class="toolbar-button" value="unlink">
                <i class="fa fa-unlink"></i>
            </button>

            <!-- liste knapper -->
            <button id="ordered-list-toolbar-button" class="toolbar-button" value="insertOrderedList">
                <div class="fa-solid fa-list-ol"></div>
            </button>
            <button id="unordered-list-toolbar-button" class="toolbar-button" value="insertUnorderedList">
                <i class="fa-solid fa-list"></i>
            </button>

            <!-- justify content knapper -->
            <hr>

            <button id="justify-left-toolbar-button" class="toolbar-button" value="justifyLeft">
                <i class="fa-solid fa-align-left"></i>
            </button>
            <button id="justify-center-toolbar-button" class="toolbar-button" value="justifyCenter">
                <i class="fa-solid fa-align-center"></i>
            </button>
            <button id="justify-right-toolbar-button" class="toolbar-button" value="justifyRight">
                <i class="fa-solid fa-align-right"></i>
            </button>

            <hr>

            <!--<button id="insert-table-toolbar-button" class="toolbar-button">
                <i class="fa-solid fa-table"></i>
            </button>

            <hr>-->

            <!-- FLYTT SAVEFILE TIL DOCUMENTMANAGER -->
            <button id="save-file-toolbar-button" class="toolbar-button">
                <i class="fa-solid fa-download"></i>
            </button>
            <button id="upload-file-toolbar-button" class="toolbar-button">
                <i class="fa-solid fa-upload"></i>
            </button>

            <hr>

            <button id="print-document-toolbar-button" class="toolbar-button">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>

        <div id="main-editor-text-input" contenteditable="true">
            <!--<p id="main-editor-text-input-placeholder-text">Hei! Her kan du skrive ting :)</p>-->
        </div>

        <div id="main-editor-footer">
            <div>
                <span id="main-editor-footer-word-counter">0 ord</span>
                <span id="main-editor-footer-character-counter">0 tegn</span>
            </div>
            <a id="main-editor-footer-version-counter">v1.0.0</a>
        </div>
    </div>

    <script src="scripts/editor.js"></script>
    <script src="scripts/keybinds.js"></script>
</body>
</html>
